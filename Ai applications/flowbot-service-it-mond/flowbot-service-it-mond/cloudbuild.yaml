steps:
- name: maven:3.8.3-openjdk-17
  entrypoint: 'mvn'
  args: ["install"]
- name: 'gcr.io/cloud-builders/docker'
  args: ["build", "-t","gcr.io/base-203423/flowbot-service:latest",  "."]
- name: 'gcr.io/cloud-builders/docker'
  args: ["push", "gcr.io/base-203423/flowbot-service:latest"]
- name: 'gcr.io/cloud-builders/docker'
  args: ["tag","gcr.io/base-203423/flowbot-service:latest","gcr.io/base-203423/flowbot-service:$BRANCH_NAME-$COMMIT_SHA"]
- name: 'gcr.io/cloud-builders/docker'
  args: ["push", "gcr.io/base-203423/flowbot-service:$BRANCH_NAME-$COMMIT_SHA"]
